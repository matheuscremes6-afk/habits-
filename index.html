<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>hábitos</title>
<style>
:root{--bg:#1B1B1D;--bg2:#262629;--line:#333337;--tx:#F3F3F4;--mu:#8D8D93;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
svg{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{max-width:560px;margin:0 auto;padding:0 20px calc(110px + env(safe-area-inset-bottom,0px))}
header{display:flex;align-items:center;gap:6px;padding:26px 0 6px}
h1{font-size:40px;font-weight:700;letter-spacing:-1.2px;margin:0;flex:1}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:var(--bg2);position:relative}
.dot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:#fff}
.sub{display:flex;align-items:center;gap:4px;color:var(--mu);font-size:14px;margin:0 0 6px;min-height:34px}
.sub button{color:var(--tx);font-size:14px;padding:6px 10px;border-radius:14px;background:var(--bg2);margin-left:auto}
.sub .ib{width:32px;height:32px;font-size:16px;background:none}
.h{padding:15px 0 13px;border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;gap:14px}
.ck{width:38px;height:38px;border-radius:50%;border:1.8px solid #5a5a60;display:grid;place-items:center;font-size:19px;color:transparent;position:relative;transition:background .25s,border-color .25s,color .2s}
.ck.on{background:var(--c);border-color:var(--c);color:#1B1B1D}
.ck.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.ck.pop::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--c);animation:ring .6s ease-out forwards}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes ring{to{transform:scale(1.7);opacity:0}}
.nm{flex:1;min-width:0}
.nm b{display:block;font-size:17px;font-weight:600;letter-spacing:-.3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm span{color:var(--mu);font-size:13px}
.nm.done b{color:var(--mu)}
.mn{width:36px;height:36px;font-size:20px;color:var(--mu);display:grid;place-items:center}
.mn svg{stroke-width:3}
.acts{margin:8px 0 0 52px;display:grid;gap:2px}
.act{display:flex;align-items:center;gap:12px;padding:6px 0;text-align:left;color:var(--tx);font-size:14px}
.act i{width:22px;height:22px;border-radius:50%;border:1.6px solid #5a5a60;display:grid;place-items:center;font-size:14px;color:transparent;transition:.2s}
.act.on i{background:var(--c);border-color:var(--c);color:#1B1B1D}
.act.on{color:var(--mu);text-decoration:line-through}
.qty{margin:8px 0 0 52px;display:flex;gap:8px;flex-wrap:wrap}
.qty button{padding:7px 14px;border-radius:16px;background:var(--bg2);font-size:14px}
.bar{height:4px;border-radius:2px;background:var(--bg2);margin:10px 0 0 52px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:2px;transition:width .3s}
.st{display:flex;align-items:center;gap:6px;color:var(--mu);font-size:13px;margin:10px 0 6px 52px}
.st svg{font-size:15px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-left:0}
.d{display:grid;justify-items:center;gap:3px;font-size:11px;color:var(--mu);padding:2px 0}

.d.t u{border-color:#5a5a60}

.d.n u{color:#55555a}
.d.f{opacity:.3;pointer-events:none}

.pri{background:#fff;color:#1B1B1D;border-radius:14px;padding:14px;text-align:center;font-weight:600;margin-top:16px;width:100%}
.red{color:#FF9B9B}
.empty{text-align:center;color:var(--mu);padding:70px 20px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fi .2s}
.sh{background:#232326;width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));animation:up .25s cubic-bezier(.2,.9,.3,1)}

input[type=text],input[type=number],input[type=time],input[type=password]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--tx)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 13px;border-radius:16px;background:var(--bg);border:1px solid var(--line);font-size:14px}
.chip.on{background:#fff;color:#1B1B1D;border-color:#fff}
.sw{width:34px;height:34px;border-radius:50%;background:var(--c);border:2px solid transparent}
.sw.on{border-color:#fff;box-shadow:0 0 0 2px #232326 inset}
.ar{display:flex;gap:8px;margin-bottom:8px}
.ar button{width:42px;color:var(--mu);font-size:18px}
.two{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

#toast.on{opacity:1;transform:translate(-50%,0)}
@media (hover:hover){.ck:not(.on):hover{border-color:#fff}.mn:hover,.ib:hover{color:#fff;background:var(--bg2)}.qty button:hover,.chip:hover,.sub button:hover{background:#34343a}.act:hover,.btn:hover{color:#fff}.d:hover u{border-color:#5a5a60}nav button:hover{color:#fff}}
@media (min-width:900px){body{padding-left:230px}#app{max-width:1120px;margin:0 auto;padding:0 48px 70px;display:grid;grid-template-columns:1fr 1fr;column-gap:56px;align-items:start}#app>*{grid-column:1/-1}#app>.h{grid-column:auto}#app>.btn,#app>.mut,#app>label,#app>input{max-width:520px}h1{font-size:52px;letter-spacing:-1.8px}header{padding-top:44px}.nm b{font-size:18px}nav{top:0;bottom:0;right:auto;width:230px;border-top:0;border-right:1px solid var(--line);padding:40px 14px;background:var(--bg)}nav div{grid-template-columns:1fr;gap:4px;max-width:none}nav button{display:flex;align-items:center;gap:14px;font-size:15px;padding:12px 14px;border-radius:12px;justify-items:start;text-align:left}nav button svg{font-size:20px}nav button.on{background:var(--bg2)}.ov{align-items:center}.sh{width:calc(100% - 48px);max-width:480px;border-radius:24px;max-height:86vh}#toast{left:calc(50% + 115px);bottom:36px}}
@media (min-width:900px) and (max-width:1100px){#app{column-gap:32px;padding:0 32px 60px}}
:root[data-theme=light]{--bg:#F5F5F7;--bg2:#E8E8EC;--line:#D9D9DE;--tx:#1B1B1D;--mu:#6B6B72;color-scheme:light}

[data-theme=light] .ck:not(.on):hover{border-color:#1B1B1D}
[data-theme=light] .d.t:not(.k) u,[data-theme=light] .d:not(.k):hover u{border-color:#B8B8BF}

[data-theme=light] .chip.on,[data-theme=light] .pri,[data-theme=light] #toast{background:#1B1B1D;color:#F5F5F7;border-color:#1B1B1D}
.chip.on:hover{background:var(--tx)}
[data-theme=light] .chip.on:hover{background:#1B1B1D}
[data-theme=light] .sh{background:#fff}
[data-theme=light] .sw.on{border-color:#1B1B1D;box-shadow:0 0 0 2px #fff inset}
[data-theme=light] .red{color:#D12F2F}
[data-theme=light] .mn:hover,[data-theme=light] .ib:hover{color:#1B1B1D}
[data-theme=light] .qty button:hover,[data-theme=light] .chip:hover,[data-theme=light] .sub button:hover{background:#D9D9DE}
[data-theme=light] .act:hover,[data-theme=light] .btn:hover{color:#000}
[data-theme=light] .btn.red:hover{color:#D12F2F}
.cf{position:fixed;z-index:60;pointer-events:none}
.flash{animation:fl 1s ease-out}
@keyframes fl{0%{background:color-mix(in srgb,var(--c) 26%,transparent)}100%{background:transparent}}
.st.hot svg{color:var(--c)}
.flash .st.hot svg{animation:fb .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes fb{0%{transform:scale(.4) rotate(-25deg)}100%{transform:none}}
.cel{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:fi .25s;cursor:pointer}
.cm{position:relative;text-align:center;color:#fff;animation:pp .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes pp{from{transform:scale(.55);opacity:0}}
.cm b,.cm span{position:relative;display:block}
.cm b{font-size:46px;letter-spacing:-1.5px;line-height:1.1;background:linear-gradient(90deg,#A8D0FF,#FFB8D1,#FFE7A3,#B5E8C3,#D0BFFF);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:4px}
.cm span{opacity:.85;margin-top:6px}
.rg,.rg::before,.rg::after{position:absolute;left:50%;top:50%;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;border:3px solid #A8D0FF;animation:rg 1.4s ease-out infinite}
.rg::before,.rg::after{content:'';left:-3px;top:-3px;margin:0;border-color:#FFB8D1;animation-delay:.25s}
.rg::after{border-color:#B5E8C3;animation-delay:.5s}
@keyframes rg{from{transform:scale(.5);opacity:1}to{transform:scale(3.4);opacity:0}}
:root{--fire:#FFC773}:root[data-theme=light]{--fire:#FF9F1C}
.fb{display:flex;align-items:center;gap:5px;padding:0 13px;height:42px;border-radius:21px;background:var(--bg2);font-weight:600;color:var(--mu);font-size:16px}.fb.hot{color:var(--fire)}.fb svg{font-size:20px}
.fw{max-width:520px;margin:0 auto;width:100%}
.fh{text-align:center;padding:10px 0 4px}.fh svg{font-size:68px;color:var(--mu)}.fh.hot svg{color:var(--fire);animation:fb .7s cubic-bezier(.3,1.6,.5,1)}.fh .big{font-size:64px;line-height:1.05}.fh p{margin:4px 0 0}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.kp div{background:var(--bg2);border-radius:16px;padding:14px 8px;text-align:center}.kp b{display:block;font-size:22px}.kp span{color:var(--mu);font-size:12px}
.mh{display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px}.mh b{font-size:19px;text-transform:capitalize}.mh button{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:var(--bg2)}
.cg{display:grid;grid-template-columns:repeat(7,1fr);row-gap:6px}.cg .w{text-align:center;color:var(--mu);font-size:12px;padding-bottom:4px}
.cd{height:40px;display:grid;place-items:center;font-size:14px;border-radius:20px}.cd u{text-decoration:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
.cd.fl{background:var(--fire);color:#1B1B1D;font-weight:600}.cd.jl{border-top-left-radius:0;border-bottom-left-radius:0}.cd.jr{border-top-right-radius:0;border-bottom-right-radius:0}
.cd.pa u{box-shadow:inset 0 0 0 2px var(--fire)}.cd.ms{color:var(--mu)}.cd.ms u{background:var(--bg2)}.cd.no,.cd.fu{color:var(--mu);opacity:.45}
.cd.sl u{box-shadow:0 0 0 2px var(--mu)}.cd.tdy u{box-shadow:0 0 0 2px var(--tx)}.cd.pa.sl u{box-shadow:inset 0 0 0 2px var(--fire),0 0 0 2px var(--mu)}.cd.pa.tdy u{box-shadow:inset 0 0 0 2px var(--fire),0 0 0 2px var(--tx)}.cd.fl.tdy u{box-shadow:0 0 0 2px #1B1B1D}
.lg{display:flex;gap:16px;flex-wrap:wrap;color:var(--mu);font-size:12px;margin:14px 0}.lg span{display:flex;align-items:center;gap:6px}.lg i{width:12px;height:12px;border-radius:50%;background:var(--fire)}.lg i.p{background:none;box-shadow:inset 0 0 0 2px var(--fire)}.lg i.m{background:var(--bg2)}
#mood{display:none}
@media (min-width:900px){body{padding-left:230px;padding-right:0}nav{left:0;right:auto;border-left:0;border-right:1px solid var(--line)}#toast{left:calc(50% + 115px)}#mood{display:block;position:fixed;z-index:6;left:0;bottom:0;width:230px;padding:18px 20px calc(26px + env(safe-area-inset-bottom,0px));text-align:center}}
.mf{position:relative;height:118px;display:grid;place-items:end center;--s:.42;--pc:0%}
.fz{transform:scale(var(--s));transform-origin:50% 100%;transition:transform .9s cubic-bezier(.3,1.5,.5,1)}
.mf svg{width:86px;height:86px;fill:color-mix(in srgb,var(--fire) var(--pc),var(--mu));stroke:none;transition:fill .9s,filter .9s;transform-origin:50% 100%;animation:fk 1.5s ease-in-out infinite}
.mf[data-z='0'] svg{animation:none}
.mf[data-z='4'] svg{filter:drop-shadow(0 0 14px var(--fire))}
@keyframes fk{0%,100%{transform:scale(1,1) rotate(-1.5deg)}50%{transform:scale(1.06,.95) rotate(1.5deg)}}
.sp{position:absolute;left:calc(50% + var(--x));bottom:34px;width:5px;height:5px;border-radius:50%;background:var(--fire);opacity:0}
.sp.on{animation:rs 2.1s ease-out infinite;animation-delay:calc(var(--i)*.35s)}
@keyframes rs{0%{transform:translateY(0) scale(1);opacity:0}15%{opacity:1}100%{transform:translateY(-92px) scale(.3);opacity:0}}
#mood b{display:block;font-size:17px;margin-top:8px}#mood span{color:var(--mu);font-size:13px}
.mbar{height:4px;border-radius:2px;background:var(--bg2);margin-top:12px;overflow:hidden}.mbar i{display:block;height:100%;width:0;background:var(--fire);border-radius:2px;transition:width .9s}
:root{--alert:#FF8FA3}:root[data-theme=light]{--alert:#E5486E}
.ug:empty{display:none}
.ugc{display:flex;align-items:center;gap:12px;background:var(--bg2);border-radius:16px;padding:12px 14px;margin:6px 0 4px}
.ugc>svg{font-size:26px;color:var(--fire)}
.ugm{flex:1;min-width:0}.ugm b{display:block;font-size:15px}.ugm span{display:block;color:var(--mu);font-size:13px;line-height:1.3}
.ugc time{font-variant-numeric:tabular-nums;font-size:22px;font-weight:700;text-align:right;letter-spacing:-.5px}.ugc time small{display:block;font-size:10px;font-weight:400;color:var(--mu);letter-spacing:0}
.ugc.ht,.ugc.cr{box-shadow:inset 0 0 0 1.5px var(--alert)}.ugc.ht>svg,.ugc.cr>svg,.ugc.ht time,.ugc.cr time{color:var(--alert)}
.ugc.cr{animation:ugp 1.4s ease-in-out infinite}

@supports not (color:color-mix(in srgb,red,blue)){.mf svg{fill:var(--fire)}}

<body>
<div id="app"></div>
<nav><div id="nav"></div></nav>
<aside id="mood"></aside>
<div id="toast" role="status"></div>
<input type="file" id="file" accept="application/json" hidden>
<script>
const K='habitos.v1',COL={azul:'#A8D0FF',rosa:'#FFB8D1',verde:'#B5E8C3',lilas:'#D0BFFF',amarelo:'#FFE7A3'},
DN=['D','S','T','Q','Q','S','S'],DL=['dom','seg','ter','qua','qui','sex','sáb'];
const P={home:'M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z',chart:'M5 20V11M12 20V4M19 20v-6',spark:'M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z',user:'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0',bell:'M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 21h4',plus:'M12 5v14M5 12h14',dots:'M5 12h.01M12 12h.01M19 12h.01',check:'M5 12.5l4.5 4.5L19 7.5',flame:'M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z',l:'M15 18l-6-6 6-6',r:'M9 6l6 6-6 6',x:'M6 6l12 12M18 6L6 18'};
const I=n=>`<svg viewBox="0 0 24 24"><path d="${P[n]}"/></svg>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=s=>{const[a,b,c]=s.split('-');return new Date(+a,b-1,+c)};
const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const today=()=>ymd(new Date());
const fm=n=>String(+(+n).toFixed(2)).replace('.',',');
function seed(){const t=today(),all=[0,1,2,3,4,5,6],h=(name,color,o)=>({id:uid(),name,color,days:all,type:'simple',actions:[],goal:{value:1,unit:'',step:1},created:t,...o});
return{habits:[
h('Estudar cálculo',COL.azul,{id:'calc',type:'goal',goal:{value:60,unit:'min',step:15}}),
h('Estudar química',COL.lilas,{id:'quim',type:'goal',goal:{value:60,unit:'min',step:15}}),
h('Vendas',COL.rosa,{id:'vend',type:'actions',actions:[{id:'v1',name:'Zerar os leads'},{id:'v2',name:'Prospectar novos clientes'}]}),
h('Beber água',COL.verde,{id:'agua',type:'goal',goal:{value:2,unit:'L',step:.25}})],
log:{},rem:{on:false,time:'20:00',last:''}}}
function load(){try{const s=JSON.parse(localStorage.getItem(K));if(s&&Array.isArray(s.habits))return s}catch(e){}return seed()}
let S=load(),sel=today(),off=0,tab='home',pop=null,sh=null,cel=false;
let cs=null,cm=null,lastDay=today();

function sheet(){if(!sh||sh.k==='reset')return'';let b='';
if(sh.k==='menu'){const h=S.habits.find(x=>x.id===sh.id);b=`<h2>${esc(h.name)}</h2><button class="btn" data-a="edit" data-h="${h.id}">Editar</button><button class="btn" data-a="mv" data-h="${h.id}" data-n="-1">Mover para cima</button><button class="btn" data-a="mv" data-h="${h.id}" data-n="1">Mover para baixo</button><button class="btn red" data-a="del" data-h="${h.id}">${sh.c?'Confirmar exclusão e histórico':'Excluir'}</button>`}
if(sh.k==='notif'){const p=pending();b=`<h2>Avisos</h2>${p.length?p.map(h=>`<div class="pl" style="--c:${h.color}"><i></i>${esc(h.name)} ainda está pendente hoje</div>`).join(''):'<div class="mut">Nada pendente. Bom trabalho.</div>'}`}
if(sh.k==='edit'){const e=sh.e;b=`<h2>${sh.new?'Novo hábito':'Editar hábito'}</h2><label>Nome</label><input type="text" id="en" value="${esc(e.name)}" maxlength="40" placeholder="Ex.: Ler 10 páginas">
<label>Cor</label><div class="chips">${Object.entries(COL).map(([n,v])=>`<button class="sw ${e.color===v?'on':''}" style="--c:${v}" data-a="col" data-v="${v}" aria-label="${n}"></button>`).join('')}</div>
<label>Frequência</label><div class="chips">${DL.map((d,i)=>`<button class="chip ${e.days.includes(i)?'on':''}" data-a="dow" data-n="${i}">${d}</button>`).join('')}</div>
<label>Tipo</label><div class="chips">${[['simple','Simples'],['actions','Composto'],['goal','Com meta']].map(([t,n])=>`<button class="chip ${e.type===t?'on':''}" data-a="typ" data-v="${t}">${n}</button>`).join('')}</div>
${e.type==='actions'?`<label>Ações (todas devem ser concluídas)</label>${e.actions.map((a,i)=>`<div class="ar"><input type="text" data-i="${i}" class="ai" value="${esc(a.name)}" placeholder="Nome da ação"><button data-a="rma" data-n="${i}" aria-label="Remover">${I('x')}</button></div>`).join('')}<button class="chip" data-a="adda">+ Adicionar ação</button>`:''}
${e.type==='goal'?`<div class="two"><div><label>Meta</label><input type="number" id="gv" step="any" min="0" value="${e.value}"></div><div><label>Unidade</label><input type="text" id="gu" value="${esc(e.unit)}" placeholder="min, L, un"></div><div><label>Passo</label><input type="number" id="gs" step="any" min="0" value="${e.step}"></div></div>`:''}
<button class="pri" data-a="save">Salvar</button>`}
return`<div class="ov" data-a="close"><div class="sh" data-a="none">${b}</div></div>`}
function render(){applyTheme();const t={home,stats,assist,profile,fire}[tab]();
const keep=document.activeElement&&document.activeElement.id;
$('app').innerHTML=t+sheet();if(document.documentElement.dataset.theme==='light')document.querySelectorAll('#app [style*=--c]').forEach(e=>{const c=LS[e.style.getPropertyValue('--c').trim().toUpperCase()];if(c)e.style.setProperty('--c',c)});const pe=document.querySelector('.ck.pop');if(pe){const r=pe.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,pe.closest('section').style.getPropertyValue('--c').trim(),18,80);navigator.vibrate&&navigator.vibrate(15)}if(cel){cel=false;celebrate()}moodUpdate();ugUpdate();
$('nav').innerHTML=[['home','Início'],['flame','Ofensiva'],['chart','Estatísticas'],['spark','Assistente'],['user','Perfil']].map(([i,n],x)=>`<button class="${tab===['home','fire','stats','assist','profile'][x]?'on':''}" data-a="tab" data-v="${['home','fire','stats','assist','profile'][x]}">${I(i)}${n}</button>`).join('');
pop=null}
const $=id=>document.getElementById(id);
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2000)}
function readEd(){const e=sh.e,n=$('en');if(n)e.name=n.value;document.querySelectorAll('.ai').forEach(i=>{if(e.actions[+i.dataset.i])e.actions[+i.dataset.i].name=i.value});if($('gv')){e.value=parseFloat($('gv').value)||0;e.unit=$('gu').value;e.step=parseFloat($('gs').value)||1}}
function newEd(){return{name:'',color:COL.azul,days:[0,1,2,3,4,5,6],type:'simple',actions:[],value:1,unit:'',step:1}}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,d=b.dataset,H=()=>S.habits.find(x=>x.id===d.h),wa=allDone(sel);
if(a==='none')return;
if(a==='close'){if(ev.target!==b)return;sh=null}
else if(a==='tab'){tab=d.v;sh=null}
else if(a==='tog'){const h=H();setE(h,sel,e=>{const was=isDone(h,sel);if(h.type==='simple')e.ok=!was;if(h.type==='actions')e.d=was?[]:h.actions.map(x=>x.id);if(h.type==='goal')e.v=was?0:h.goal.value;});if(isDone(h,sel))pop=h.id}
else if(a==='act'){const h=H();setE(h,sel,e=>{e.d=e.d||[];const i=e.d.indexOf(d.x);i<0?e.d.push(d.x):e.d.splice(i,1)});if(isDone(h,sel))pop=h.id}
else if(a==='amt'){const h=H(),was=isDone(h,sel);setE(h,sel,e=>{e.v=Math.max(0,Math.round(((e.v||0)+parseFloat(d.n))*1000)/1000)});if(!was&&isDone(h,sel)){pop=h.id;toast('Meta batida')}}
else if(a==='day')sel=d.d;
else if(a==='wk'){off=Math.min(0,off+parseInt(d.n))}
else if(a==='now'){sel=today();off=0}
else if(a==='bell')sh={k:'notif'};
else if(a==='menu')sh={k:'menu',id:d.h};
else if(a==='new')sh={k:'edit',new:true,e:newEd()};
else if(a==='edit'){const h=H();sh={k:'edit',id:h.id,e:{name:h.name,color:h.color,days:[...h.days],type:h.type,actions:h.actions.map(x=>({...x})),value:h.goal.value,unit:h.goal.unit,step:h.goal.step}}}
else if(a==='mv'){const i=S.habits.findIndex(x=>x.id===d.h),j=i+parseInt(d.n);if(j>=0&&j<S.habits.length){[S.habits[i],S.habits[j]]=[S.habits[j],S.habits[i]];save()}}
else if(a==='del'){if(!sh.c){sh.c=1}else{S.habits=S.habits.filter(x=>x.id!==d.h);Object.values(S.log).forEach(o=>delete o[d.h]);(S.del=S.del||[]).push(d.h);save();sh=null;toast('Hábito excluído')}}
else if(a==='col'){readEd();sh.e.color=d.v}
else if(a==='dow'){readEd();const e=sh.e,n=+d.n,i=e.days.indexOf(n);i<0?e.days.push(n):e.days.length>1&&e.days.splice(i,1)}
else if(a==='typ'){readEd();sh.e.type=d.v;if(d.v==='actions'&&!sh.e.actions.length)sh.e.actions.push({id:uid(),name:''})}
else if(a==='adda'){readEd();sh.e.actions.push({id:uid(),name:''})}
else if(a==='rma'){readEd();sh.e.actions.splice(+d.n,1)}
else if(a==='save'){readEd();const e=sh.e;if(!e.name.trim()){toast('Dê um nome ao hábito');return}
const acts=e.actions.filter(x=>x.name.trim()).map(x=>({id:x.id,name:x.name.trim()}));
if(e.type==='actions'&&!acts.length){toast('Adicione ao menos uma ação');return}
const o={name:e.name.trim(),color:e.color,days:e.days.sort(),type:e.type,actions:acts,goal:{value:e.value||1,unit:e.unit.trim(),step:e.step||1}};
if(sh.new)S.habits.push({id:uid(),created:today(),...o});else Object.assign(S.habits.find(x=>x.id===sh.id),o);
save();sh=null;toast('Hábito salvo')}
else if(a==='theme'){S.theme=d.v;save()}
else if(a==='cday')cs=d.d;
else if(a==='cal'){cm=new Date(cm.getFullYear(),cm.getMonth()+parseInt(d.n),1)}
else if(a==='goto'){const k=cs||today(),n=Math.round((pd(today())-pd(k))/864e5);sel=k;off=-Math.floor(n/7);tab='home'}
else if(a==='login'){authDo('in')}else if(a==='signup'){authDo('up')}else if(a==='logout'){outDo()}else if(a==='sync'){syncNow()}
else if(a==='rem'){S.rem.on=!S.rem.on;save();if(S.rem.on&&'Notification' in window&&Notification.permission==='default')Notification.requestPermission()}
else if(a==='export'){const u=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'})),l=document.createElement('a');l.href=u;l.download='habitos-backup-'+today()+'.json';l.click();setTimeout(()=>URL.revokeObjectURL(u),500);toast('Backup exportado')}
else if(a==='import')$('file').click();
else if(a==='reset'){if(sh&&sh.k==='reset'){const old=S.habits.map(h=>h.id).concat(S.del||[]);S=seed();S.del=old.filter(id=>!S.habits.some(h=>h.id===id));S.force=1;save();sh=null;sel=today();toast('Dados apagados')}else{sh={k:'reset'}}}
if(!wa&&['tog','act','amt'].includes(a)&&allDone(sel))cel=true;render()});
document.addEventListener('change',ev=>{if(ev.target.id==='rt'){S.rem.time=ev.target.value;save()}});
$('file').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!Array.isArray(j.habits)||typeof j.log!=='object')throw 0;S={rem:{on:false,time:'20:00',last:''},...j};S.force=1;save();sel=today();off=0;render();toast('Backup importado')}catch(x){toast('Arquivo de backup inválido')}};r.readAsText(f);e.target.value=''});
setInterval(()=>{const r=S.rem,n=new Date(),hm=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
if(r.on&&r.time===hm&&r.last!==today()&&pending().length){r.last=today();save();const m=pending().length+' hábito(s) pendente(s) hoje';toast(m);try{if(Notification.permission==='granted')new Notification('hábitos',{body:m})}catch(e){}}},30000);
render();
</script>
</body>
</html>
